name: Publish
on:
  push:
    branches: [main]

# Version commit + tag + GitHub release
permissions:
  contents: write

# Never run two releases at once
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
      postgres:
        image: postgres:16-alpine
        ports: [5432:5432]
        env:
          POSTGRES_DB: psyqueue_test
          POSTGRES_USER: psyqueue
          POSTGRES_PASSWORD: psyqueue
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bumpcraft reads commits since the last tag
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # bumpcraft only computes the version and changelog here; it doesn't
      # publish to npm. Exit code 2 means no releasable commits.
      - name: Compute next version
        id: plan
        run: |
          set +e
          npx bumpcraft release --dry-run > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 2 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::bumpcraft failed (exit $code)"
            exit "$code"
          fi
          version=$(sed -n 's/^\[dry-run\] Would release: \([^ ]*\) .*/\1/p' plan.txt)
          if [ -z "$version" ]; then
            echo "::error::Could not read the next version from bumpcraft output"
            exit 1
          fi
          awk 'found; /^\[dry-run\] Would release:/ { found = 1 }' plan.txt > notes.md
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require npm token
        if: steps.plan.outputs.release == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Release v${{ steps.plan.outputs.version }} is due but the NPM_TOKEN secret is not set. Add it under Settings > Secrets > Actions, then re-run this workflow."
            exit 1
          fi

      - name: Set versions
        if: steps.plan.outputs.release == 'true'
        run: |
          v="${{ steps.plan.outputs.version }}"
          npm pkg set version="$v"
          pnpm -r --filter "./packages/*" exec npm pkg set version="$v"

      # pnpm rewrites workspace:* dependencies to the published version and
      # skips packages whose version is already on npm, so a re-run after a
      # partial failure is safe.
      - name: Publish to npm
        if: steps.plan.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks

      - name: Commit version, tag and GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.plan.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$v [skip ci]"
          git tag "v$v"
          git push origin HEAD:main "v$v"
          gh release create "v$v" --title "v$v" --notes-file notes.md --verify-tag
